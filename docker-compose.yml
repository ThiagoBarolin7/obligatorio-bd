services:
  servidor:
    build:
      context: .
    container_name: obligatorio_servidor
    restart: unless-stopped
    ports:
      - "1099:1099"
      - "1098:1098"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/Escuela
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - red-app

  mysql:
    image: mysql:8.4
    container_name: obligatorio-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Escuela}
      MYSQL_USER: ${MYSQL_USER:-app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-app123A}
    volumes:
      - db-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 10
      start_period: 30s
    networks:
      - red-app

volumes:
  db-data:

networks:
  red-app:
    driver: bridge
