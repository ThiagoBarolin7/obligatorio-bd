plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.3.1'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'com.mysql:mysql-connector-j:9.1.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'ude.obligatorio.servidor.ServidorRMI'
}

tasks.register('runServidor', JavaExec) {
    group = 'application'
    description = 'Levanta el servidor RMI que publica la Fachada'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ude.obligatorio.servidor.ServidorRMI'
    workingDir = project.projectDir
}

tasks.register('runCliente', JavaExec) {
    group = 'application'
    description = 'Abre la capa grafica, que accede a la Fachada por RMI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ude.obligatorio.grafica.Principal'
    workingDir = project.projectDir
}

tasks.register('runCrearBd', JavaExec) {
    group = 'application'
    description = 'Crea la base Escuela y carga los alumnos'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'ude.obligatorio.CreacionBaseDatos'
    workingDir = project.projectDir
}

tasks.named('test') {
    useJUnitPlatform()
}
