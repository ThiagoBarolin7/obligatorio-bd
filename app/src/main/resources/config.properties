# ── Conexión a MySQL ────────────────────────────────────────────
driver=${DB_DRIVER:-com.mysql.cj.jdbc.Driver}
url=${DB_URL:-jdbc:mysql://localhost:3306/Escuela}
user=${DB_USER:-root}
password=${DB_PASSWORD:-root}
tamanio=${DB_TAMANIO:-5}

# ── Registro RMI ────────────────────────────────────────────────
rmi.host=${RMI_HOST:-localhost}
rmi.puerto=${RMI_PUERTO:-1099}
rmi.nombre=${RMI_NOMBRE:-Fachada}
rmi.servidor.puerto=${RMI_SERVIDOR_PUERTO:-1098}

# ── Persistencia (pool / fábrica) ───────────────────────────────
poolConcreto=${POOL_CONCRETO:-ude.obligatorio.persistencia.poolConexiones.PoolConexionesTxt}
fabricaConcreta=${FABRICA_CONCRETO:-ude.obligatorio.persistencia.fabrica.FabricaTxt}
maximoEscritoresEnEspera=${MAXIMO_ESCRITORES_ESPERA:-2}
directorio=${DIRECTORIO:-./data}